<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wenja Games</title>
  <meta name="description" content="Wenja Games makes calm, colourful mobile games. Our first game is Block Puzzle.">
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    :root {
      --bg: #fdfaf4; --ink: #30231c; --muted: #6b5a4e;
      --accent: #7a3fe0; --card: #ffffff; --line: #eadfcf;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1712; --ink: #f6eee4; --muted: #c2b3a3;
        --accent: #b89aff; --card: #27201a; --line: #3a3027;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px 32px; }
    h1 { font-size: 2rem; margin: 0 0 4px; }
    .tag { color: var(--muted); margin: 0 0 40px; }
    .game {
      display: flex; gap: 20px; align-items: center;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 24px; padding: 20px;
    }
    .game img { width: 96px; height: 96px; border-radius: 22px; flex: none; }
    .game h2 { margin: 0 0 4px; font-size: 1.35rem; }
    .game p { margin: 0 0 8px; color: var(--muted); }
    a { color: var(--accent); }
    footer {
      margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: 0.9rem;
    }
    footer a { margin-right: 16px; }
  </style>
</head>
<body>
<main>
  <h1>Wenja Games</h1>
  <p class="tag">Calm, colourful games for your phone.</p>

  <section class="game">
    <img src="icon.png" alt="Block Puzzle icon">
    <div>
      <h2>Block Puzzle</h2>
      <p>Drag blocks, clear lines and chase combos, with a new Daily
        Challenge every day. Five themes, play offline, no account needed.</p>
      <!-- After launch, replace this line with:
      <a href="https://play.google.com/store/apps/details?id=com.wenjagames.blockpuzzle">Get it on Google Play</a>
      -->
      <strong>Coming soon to Google Play.</strong>
    </div>
  </section>

  <footer>
    <a href="privacy.html">Privacy policy</a>
    <a href="mailto:wenjagames@gmail.com">Contact</a>
    <div>© 2026 Wenja Games</div>
  </footer>
</main>
</body>
</html>
